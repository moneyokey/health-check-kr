<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건강검진 결과 해석기</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
            --normal-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --normal-bg: #e8f5e9;
            --warning-bg: #fff3e0;
            --danger-bg: #ffebee;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #121212;
                --bg-secondary: #1e1e1e;
                --bg-card: #2c2c2c;
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --border-color: #404040;
                --shadow: rgba(0, 0, 0, 0.3);
                --normal-bg: #1b5e20;
                --warning-bg: #e65100;
                --danger-bg: #b71c1c;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px 0;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .disclaimer {
            background-color: var(--warning-bg);
            border-left: 4px solid var(--warning-color);
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: 4px;
            font-size: 14px;
        }

        .input-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        .input-with-unit {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="number"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #2196f3;
        }

        .unit {
            color: var(--text-secondary);
            font-size: 14px;
            min-width: 60px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1976d2;
        }

        .btn:active {
            background-color: #0d47a1;
        }

        #results {
            margin-top: 24px;
        }

        .result-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 4px var(--shadow);
            border-left: 4px solid;
        }

        .result-card.normal {
            border-left-color: var(--normal-color);
            background-color: var(--normal-bg);
        }

        .result-card.warning {
            border-left-color: var(--warning-color);
            background-color: var(--warning-bg);
        }

        .result-card.danger {
            border-left-color: var(--danger-color);
            background-color: var(--danger-bg);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .result-name {
            font-weight: 600;
            font-size: 16px;
        }

        .result-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .result-status.normal {
            background-color: var(--normal-color);
            color: white;
        }

        .result-status.warning {
            background-color: var(--warning-color);
            color: white;
        }

        .result-status.danger {
            background-color: var(--danger-color);
            color: white;
        }

        .result-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-range {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .result-description {
            font-size: 14px;
            line-height: 1.5;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 20px;
            }

            .input-section {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 건강검진 결과 해석기</h1>
            <p class="subtitle">내 건강 수치를 쉽게 이해하기</p>
        </header>

        <div class="disclaimer">
            ⚠️ <strong>주의:</strong> 이 도구는 참고용으로만 사용하세요. 의료 조언이나 진단을 대체할 수 없습니다. 정확한 해석은 의사와 상담하세요.
        </div>

        <div class="input-section">
            <h2 style="margin-bottom: 16px; font-size: 18px;">검진 수치 입력</h2>
            
            <div class="input-group">
                <label for="glucose">공복혈당</label>
                <div class="input-with-unit">
                    <input type="number" id="glucose" placeholder="예: 95" step="1" min="0">
                    <span class="unit">mg/dL</span>
                </div>
            </div>

            <div class="input-group">
                <label for="totalCholesterol">총 콜레스테롤</label>
                <div class="input-with-unit">
                    <input type="number" id="totalCholesterol" placeholder="예: 190" step="1" min="0">
                    <span class="unit">mg/dL</span>
                </div>
            </div>

            <div class="input-group">
                <label for="hdl">HDL 콜레스테롤 (좋은 콜레스테롤)</label>
                <div class="input-with-unit">
                    <input type="number" id="hdl" placeholder="예: 55" step="1" min="0">
                    <span class="unit">mg/dL</span>
                </div>
            </div>

            <div class="input-group">
                <label for="ldl">LDL 콜레스테롤 (나쁜 콜레스테롤)</label>
                <div class="input-with-unit">
                    <input type="number" id="ldl" placeholder="예: 115" step="1" min="0">
                    <span class="unit">mg/dL</span>
                </div>
            </div>

            <div class="input-group">
                <label for="triglycerides">중성지방</label>
                <div class="input-with-unit">
                    <input type="number" id="triglycerides" placeholder="예: 120" step="1" min="0">
                    <span class="unit">mg/dL</span>
                </div>
            </div>

            <div class="input-group">
                <label for="ast">AST (간수치)</label>
                <div class="input-with-unit">
                    <input type="number" id="ast" placeholder="예: 25" step="1" min="0">
                    <span class="unit">U/L</span>
                </div>
            </div>

            <div class="input-group">
                <label for="alt">ALT (간수치)</label>
                <div class="input-with-unit">
                    <input type="number" id="alt" placeholder="예: 30" step="1" min="0">
                    <span class="unit">U/L</span>
                </div>
            </div>

            <div class="input-group">
                <label for="sbp">수축기 혈압 (최고혈압)</label>
                <div class="input-with-unit">
                    <input type="number" id="sbp" placeholder="예: 120" step="1" min="0">
                    <span class="unit">mmHg</span>
                </div>
            </div>

            <div class="input-group">
                <label for="dbp">이완기 혈압 (최저혈압)</label>
                <div class="input-with-unit">
                    <input type="number" id="dbp" placeholder="예: 80" step="1" min="0">
                    <span class="unit">mmHg</span>
                </div>
            </div>

            <div class="input-group">
                <label for="bmi">BMI (체질량지수)</label>
                <div class="input-with-unit">
                    <input type="number" id="bmi" placeholder="예: 23.5" step="0.1" min="0">
                    <span class="unit">kg/m²</span>
                </div>
            </div>

            <button class="btn" onclick="analyzeResults()">결과 분석하기</button>
        </div>

        <div id="results" class="hidden"></div>

        <footer>
            <p><strong>기준 출처:</strong></p>
            <p>대한민국 국가건강검진 기준 (국민건강보험공단), 대한당뇨병학회, 대한고혈압학회, 대한비만학회 진료지침</p>
            <p style="margin-top: 8px;">본 서비스는 참고용이며 의료 행위를 대체하지 않습니다.</p>
        </footer>
    </div>

    <script src="health-analyzer.js"></script>
</body>
</html>
